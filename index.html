<style>
  :root {
    --bg: #0d0f14;
    --card: #1c1f26;
    --border: #2a2e3d;
    --txt: #ffffff;
    --dim: #8b92a5;
    --red: #f02828;
    --red-glow: rgba(240, 40, 40, 0.4);
    --blue: #3b82f6;
    --green: #22c55e;
    --yellow: #eab308;
    --purple: #a855f7;
    --pink: #ec4899;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { 
    background: #0d0f14; 
    background-image: url('https://sun9-20.userapi.com/impg/2HqP4HqP4HqP4HqP/br_bg.jpg?size=1080x1920&quality=96&sign=123');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--txt); 
    min-height: 100vh; 
    padding: 20px 15px 40px; 
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(13, 15, 20, 0.85);
    z-index: 0;
  }

  .garant-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    background: rgba(17, 19, 24, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 20px rgba(240, 40, 40, 0.1);
    margin-top: 20px;
  }

  .garant-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 20px; 
    border-bottom: 1px solid var(--border); 
    padding-bottom: 15px; 
  }
  .garant-header-title { font-weight: 900; font-size: 18px; color: var(--red); text-transform: uppercase; }
  .year-badge { background:#2a2e3d; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:800; }

  .input-group { margin-bottom: 14px; }
  .input-group label {
    display: block; font-size: 11px; color: var(--dim);
    margin-bottom: 6px; font-weight: 700; text-transform: uppercase;
  }
  .input-group input {
    width: 100%; background: #0a0b0e; border: 1px solid var(--border);
    color: var(--txt); padding: 14px 16px; border-radius: 8px; font-size: 15px;
  }
  .input-group input:focus { outline: none; border-color: var(--red); }
  
  .selected-server-display {
    width: 100%; background: #0a0b0e; border: 1px solid var(--border);
    color: var(--txt); padding: 14px 16px; border-radius: 8px; font-size: 15px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .selected-server-display span { color: #555; font-size: 12px; }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 8px;
    font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .btn-main { background: var(--red); color: white; box-shadow: 0 4px 20px var(--red-glow); margin-top: 10px; }
  .btn-main:hover { background: #ff4747; }
  .btn-main:disabled { background: #555; box-shadow: none; cursor: not-allowed; }
  .btn-success { background: var(--green); color: #fff; margin-top: 12px; }

  .success-screen { display: none; text-align: left; padding: 10px 0; }
  .success-screen h3 { color: var(--green); font-size: 18px; margin-bottom: 16px; text-align: center; }
  .data-box { background: #0a0b0e; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .data-label { color: var(--dim); }
  .data-value { font-weight: 700; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 15, 20, 0.98);
    z-index: 1000;
    display: none;
    flex-direction: column;
    padding: 20px 15px;
    overflow-y: auto;
  }
  .modal-overlay.active { display: flex; }

  .modal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 15px;
  }

  .arcanum-logo {
    width: 50px; height: 50px;
    background: #000;
    border: 2px solid #3b82f6;
    border-radius: 50%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    flex-shrink: 0;
  }
  .arcanum-logo span:first-child { font-size: 16px; font-weight: 900; color: #fff; line-height: 1; }
  .arcanum-logo span:last-child { font-size: 7px; font-weight: 700; color: #3b82f6; letter-spacing: 1px; }

  .modal-title { font-size: 20px; font-weight: 800; flex-grow: 1; margin-left: 5px; }
  
  .btn-close {
    background: #1c1f26;
    border: 1px solid var(--border);
    color: white;
    width: 44px; height: 44px;
    border-radius: 8px;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer;
    font-size: 18px;
    flex-shrink: 0;
  }

  .search-box {
    width: 100%;
    background: #12141a;
    border: 1px solid #333;
    color: white;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .search-box:focus { outline: none; border-color: #555; }

  .servers-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-bottom: 40px;
  }

  .server-card {
    background: linear-gradient(135deg, #1c1f26 0%, #15171d 100%);
    border: 1px solid #2e323d;
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100px;
    transition: 0.2s;
  }
  .server-card:hover { border-color: #555; transform: translateY(-2px); }
  .server-card:active { transform: scale(0.98); }

  .server-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .server-num { font-size: 12px; color: #6b7280; font-weight: 700; margin-bottom: 4px; }
  
  .server-tag {
    font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .tag-new { background: var(--red); color: #fff; }
  .tag-current { background: var(--blue); color: #fff; }
  .tag-recommend { background: var(--green); color: #fff; }

  .server-name { font-size: 15px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; line-height: 1.2; }
  
  .server-bottom { margin-top: auto; }
  .server-online { font-size: 11px; color: #9ca3af; margin-bottom: 6px; font-weight: 600; }
  .server-bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; width: 100%; }
  .server-fill { height: 100%; border-radius: 2px; }
  
  .c-red { background: var(--red); }
  .c-blue { background: var(--blue); }
  .c-green { background: var(--green); }
  .c-yellow { background: var(--yellow); }
  .c-purple { background: var(--purple); }
  .c-pink { background: var(--pink); }
  .c-white { background: #fff; }
  .c-orange { background: #f97316; }
  .c-aqua { background: #06b6d4; }
  .c-lime { background: #84cc16; }

</style>

    });
