<!DOCTYPE html>
<html lang="ru">

<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --card: rgba(17, 19, 24, 0.95);
    --border: #2a2e3d;
    --txt: #ffffff;
    --dim: #8b92a5;
    --red: #f02828;
    --red-glow: rgba(240, 40, 40, 0.4);
    --blue: #3b82f6;
    --green: #22c55e;
    --yellow: #eab308;
    --purple: #a855f7;
    --pink: #ec4899;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  
  body { 
    background-color: #0d0f14; 
    /* Официальный арт с фонарем/машиной */
    background-image: url('https://sun9-20.userapi.com/impg/2HqP4HqP4HqP4HqP/br_bg.jpg?size=1080x1920&quality=96&sign=123');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--txt); 
    min-height: 100vh; 
    padding: 20px 15px 40px; 
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(13,15,20,0.6) 0%, rgba(13,15,20,0.95) 100%);
    z-index: 0;
  }

  .main-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  /* Логотип сверху */
  .top-logo {
    text-align: center;
    margin-bottom: 10px;
  }
  .top-logo img {
    width: 140px;
    filter: drop-shadow(0 0 15px rgba(240, 40, 40, 0.4));
  }

  /* Карточка формы */
  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .header-title { font-weight: 900; font-size: 16px; color: #fff; letter-spacing: 1px;}
  .header-title span { color: var(--red); }
  .year-badge { background:#2a2e3d; padding:4px 8px; border-radius:4px; font-size:11px; font-weight:800; color: #fff;}

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; color: var(--dim);
    margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input {
    width: 100%; background: #0a0b0e; border: 1px solid var(--border);
    color: var(--txt); padding: 12px 14px; border-radius: 8px; font-size: 14px;
    font-family: 'Montserrat', sans-serif;
    transition: 0.2s;
  }
  .field input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); }
  
  .server-select-btn {
    width: 100%; background: #0a0b0e; border: 1px solid var(--border);
    color: var(--txt); padding: 12px 14px; border-radius: 8px; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-family: 'Montserrat', sans-serif;
  }
  .server-select-btn span { color: #555; font-size: 12px; }

  .btn-main {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--red); color: white; box-shadow: 0 4px 15px var(--red-glow);
    margin-top: 10px;
  }
  .btn-main:hover { background: #ff4747; }
  .btn-main:active { transform: scale(0.98); }
  .btn-main:disabled { background: #444; box-shadow: none; cursor: not-allowed; }

  /* Экран успеха */
  .success-box { display: none; }
  .success-box h3 { color: var(--green); font-size: 16px; margin-bottom: 15px; text-align: center; text-transform: uppercase; }
  .data-box { background: #0a0b0e; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
  .data-row:last-child { margin-bottom: 0; }
  .data-label { color: var(--dim); }
  .data-value { font-weight: 700; color: #fff; }

  .btn-success {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--green); color: white;
  }

  /* Модалка серверов */
  .modal {
    position: fixed; inset: 0; background: rgba(13, 15, 20, 0.98);
    z-index: 1000; display: none; flex-direction: column; padding: 20px 15px;
    overflow-y: auto;
  }
  .modal.active { display: flex; }
  
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .modal-head h2 { font-size: 18px; font-weight: 800; color: #fff; }
  .close-btn { background: #1c1f26; border: 1px solid var(--border); color: white; width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; }
  
  .search-input { width: 100%; background: #12141a; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-family: 'Montserrat', sans-serif; }
  .search-input:focus { outline: none; border-color: #555; }

  .servers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  .server-card {
    background: linear-gradient(135deg, #1c1f26 0%, #15171d 100%);
    border: 1px solid #2e323d; border-radius: 8px; padding: 12px;
    cursor: pointer; position: relative; display: flex; flex-direction: column;
    min-height: 90px; transition: 0.2s;
  }
  .server-card:hover { border-color: #555; }
  .server-card:active { transform: scale(0.97); }
  
  .s-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .s-num { font-size: 11px; color: #6b7280; font-weight: 700; }
  .s-tag { font-size: 8px; font-weight: 800; padding: 2px 4px; border-radius: 4px; text-transform: uppercase; }
  .t-new { background: var(--red); color: #fff; }
  .t-curr { background: var(--blue); color: #fff; }
  
  .s-name { font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; color: #fff; }
  
  .s-bottom { margin-top: auto; }
  .s-online { font-size: 10px; color: #9ca3af; margin-bottom: 4px; font-weight: 600; }
  .s-bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
  .s-fill { height: 100%; border-radius: 2px; }
  
  .c-red { background: var(--red); }
  .c-blue { background: var(--blue); }
  .c-green { background: var(--green); }
  .c-yellow { background: var(--yellow); }
  .c-purple { background: var(--purple); }
  .c-pink { background: var(--pink); }
  .c-white { background: #fff; }
  .c-orange { background: #f97316; }
  .c-aqua { background: #06b6d4; }
  .c-lime { background: #84cc16; }

</style>
