<style>

    --card: #14161c;
    --border: #2a2e3d;
    --txt: #ffffff;
    --dim: #8b92a5;
    --red: #ff2a2a;

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

  /* ================= ГЛАВНЫЙ ЭКРАН ================= */

    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: url('https://sun9-63.userapi.com/impg/4C7N3Q_wJ4Xq3g9q_wJ4Xq3g9qw/br_bg.jpg?size=1080x1920&quality=96&sign=123') center/cover no-repeat;

    text-align: center;
  }
  
  /* Затемнение фона */
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,11,14,0.3) 0%, rgba(10,11,14,0.95) 90%);
    z-index: 1;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 400px;
    width: 100%;
  }

  .logo-img {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;

    filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
  }

  .hero-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .hero-title span { color: var(--red); }

  .hero-subtitle {
    font-size: 14px;
    color: var(--dim);
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .btn-play {
    display: inline-block;
    background: #fff;
    color: #000;
    font-weight: 800;
    font-size: 16px;
    padding: 16px 40px;
    border-radius: 8px;
    text-decoration: none;
    margin-bottom: 30px;
    cursor: pointer;
    border: none;
    width: 100%;
    max-width: 300px;
    transition: 0.2s;
  }
  .btn-play:hover { background: #e0e0e0; }

  .brand-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .brand-bar span { font-weight: 800; font-size: 18px; letter-spacing: 1px; }
  .brand-bar span span { color: var(--red); }

  /* ================= МОДАЛКА С СЕРВЕРАМИ ================= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 14, 0.95);
    backdrop-filter: blur(5px);
    z-index: 1000;
    display: none;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
  }
  .modal-overlay.active { display: flex; }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 20px; font-weight: 800; }
  .btn-close {
    background: var(--card);
    border: 1px solid var(--border);
    color: white;
    width: 40px; height: 40px;
    border-radius: 8px;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer;
    font-size: 18px;
  }

  .search-box {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: white;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .search-box:focus { outline: none; border-color: var(--red); }

  .servers-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .server-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: 0.2s;
    position: relative;
    overflow: hidden;
  }
  .server-card:hover { border-color: var(--red); transform: translateY(-2px); }
  
  .server-num { font-size: 12px; color: var(--dim); font-weight: 700; margin-bottom: 4px; }
  .server-name { font-size: 16px; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; }
  
  .server-bar {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .server-fill {
    height: 100%;
    border-radius: 2px;
  }
  .fill-red { background: #ff2a2a; }
  .fill-blue { background: #2a7fff; }
  .fill-green { background: #00c853; }
  .fill-purple { background: #8a2be2; }
  .fill-yellow { background: #ffc107; }

  .server-online { font-size: 11px; color: var(--dim); margin-top: 6px; }

  /* ================= ФОРМА ГАРАНТА ================= */
  .garant-container {
    display: none; /* Скрыто по умолчанию */
    width: 100%;
    max-width: 440px;
    margin: 40px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 30px rgba(255, 42, 42, 0.15);

  .garant-container::before {

    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);

  .input-group { margin-bottom: 16px; }
  .input-group label {

    margin-bottom: 6px; font-weight: 700; text-transform: uppercase;

  .input-group input {

  .selected-server-display {

    display: flex; justify-content: space-between; align-items: center;

  .btn {

  .data-box { background: #0a0b0e; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .data-label { color: var(--dim); }
  .data-value { font-weight: 700; }
